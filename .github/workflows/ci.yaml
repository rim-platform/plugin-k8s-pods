name: CI

# On every pull request and push to master: type-checks, lints, checks the formatting, runs the
# tests, checks that the committed main.mjs and panels/ are a fresh build of the sources, and
# bundles the plugin into a .rimbundle kept as the run's artifact.
#
# Every action is pinned to a full commit SHA, with its version in a comment.

on:
  pull_request:
  push:
    branches: ["master"]

# Read-only token: nothing here pushes, comments or publishes. The artifact uses the Actions
# runtime token, not this one.
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Type Check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format Check
        run: npm run format:check
      - name: Tests
        run: npm test
      # Install from git URL runs the committed main.mjs, so it must be what the sources build.
      - name: Fresh Build Check
        run: npm run check
      - name: Bundle
        run: npm run bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rimbundle
          path: dist/*.rimbundle
          if-no-files-found: error
          retention-days: 7
